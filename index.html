<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Tài sản & Vật tư Truyền dẫn LAB</title>
  <link rel="stylesheet" href="assets/style.css?v=2026.11.14-1">
</head>
<body>

  <header id="header" class="header">
    <div class="header-left">
      <button id="btnMenu" class="btn ghost" aria-label="Menu">☰</button>
      <h1>Quản lý Vật tư LAB</h1>
    </div>
    <div class="header-right">
      <button id="btnSync" class="btn ghost sync-off" title="Trạng thái đồng bộ">
        <i>☁</i> <span>Chỉ trên máy</span>
      </button>
    </div>
  </header>

  <div id="editbar" class="editbar" hidden>
    <b>Đang ở chế độ chỉnh sửa.</b> Bấm vào ô để sửa, tích ô <b>Đã kiểm</b>, thêm/xoá dòng.
    Thay đổi <u>chỉ lưu trên trình duyệt này</u> – dùng <b>Xuất / Sao lưu</b> để giữ hoặc chia sẻ.
  </div>

  <div class="layout" id="layout" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Danh sách sheet"></aside>
    <div id="overlay" class="overlay"></div>
    <main id="main" class="main"></main>
  </div>

  <input type="file" id="fileIn" accept="application/json,.json" hidden>
  <div id="modalRoot"></div>
  <div id="printRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Thư viện bổ trợ (Excel, QR, v.v.) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="assets/Qr.js?v=2026.11.14-1"></script>

  <!-- Các script cốt lõi của ứng dụng (Đảm bảo tải đúng thứ tự) -->
  <script src="assets/config.js?v=2026.11.14-1"></script>
  <script src="assets/data.js?v=2026.11.14-1"></script>
  <script src="assets/app.js?v=2026.11.14-1"></script>
  <script src="assets/slips.js?v=2026.11.14-1"></script>
  <script src="assets/sync.js?v=2026.11.14-1" defer></script>
</body>
</html>
