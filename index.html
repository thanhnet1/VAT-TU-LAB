<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a5b">
<title>Tài sản – Vật tư Truyền dẫn LAB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=2026.11.23-2">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div><p>Đang tải dữ liệu…</p></div>

<header class="topbar" id="topbar" hidden>
  <button id="btnMenu" class="icon-btn only-mobile" aria-label="Mở menu">☰</button>
  <a class="brand" href="#/" title="Về trang Tổng quan">
    <span class="logo">📡</span>
    <span class="brand-text"><b id="appTitle"></b><small id="appSub"></small></span>
  </a>
  <label class="search">
    <span aria-hidden="true">🔍</span>
    <input id="gq" type="search" title="Phím tắt: /" placeholder="Tìm serial, part number, tên vật tư…" autocomplete="off" spellcheck="false">
    <button id="gqClear" type="button" class="search-clear" hidden aria-label="Xoá tìm kiếm">✕</button>
  </label>
  <div class="actions">
    <span id="dirty" class="dirty" hidden title="Bạn đã chỉnh sửa dữ liệu – chỉ lưu trên trình duyệt này">● Đã chỉnh sửa</span>
    <button id="btnSync" class="btn ghost sync-off" type="button" title="Đồng bộ nhiều thiết bị"><i>☁</i> <span>Chỉ trên máy</span></button>
    <button id="btnEdit" class="btn" type="button" aria-pressed="false">✏️ <span>Chỉnh sửa</span></button>
    <details class="menu" id="menuExport">
      <summary class="btn">⬇ <span>Xuất / Sao lưu</span></summary>
      <div class="menu-pop">
        <button type="button" data-act="xlsx-all">📗 Excel – toàn bộ các sheet</button>
        <button type="button" data-act="xlsx-cur">📗 Excel – sheet đang xem</button>
        <button type="button" data-act="csv-cur">📄 CSV – sheet đang xem</button>
        <hr>
        <button type="button" onclick="document.getElementById('importFileInput').click()">📂 Cập nhật nguồn (Excel, Word, PDF)…</button>
        <hr>
        <button type="button" data-act="json-out">💾 Sao lưu JSON (kèm chỉnh sửa)</button>
        <button type="button" data-act="json-in">📂 Nhập sao lưu JSON…</button>
        <hr>
        <button type="button" data-act="reset" class="danger">↩ Khôi phục dữ liệu gốc</button>
      </div>
    </details>
    <button id="btnPrint" class="btn ghost" type="button" title="In trang đang xem (A4 ngang)">🖨</button>
    <button id="btnTheme" class="btn ghost" type="button" title="Đổi giao diện sáng / tối">🌓</button>
  </div>
</header>

<div id="editbar" class="editbar" hidden>
  ✏️ <b>Đang ở chế độ chỉnh sửa.</b> Chọn <b>Nguồn</b> (Vật tư, Tài sản, Đo kiểm, Sửa chữa, Không rõ nguồn), bấm vào ô để sửa, thêm/xoá dòng hoặc bấm <b>➜</b> cuối dòng để chuyển thư mục.
  Thay đổi <u>chỉ lưu trên trình duyệt này</u> – dùng <b>Xuất / Sao lưu</b> để giữ hoặc chia sẻ.
</div>

<div class="layout" id="layout" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Danh sách thư mục"></aside>
  <div id="overlay" class="overlay"></div>
  <main id="main" class="main"></main>
</div>

<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="importFileInput" accept=".xlsx,.xls,.docx,.pdf" hidden>
<div id="modalRoot"></div>
<div id="printRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js?v=2026.11.23-2"></script>
<script src="assets/data.js?v=2026.11.23-2" onload="window.dispatchEvent(new CustomEvent('lab:data-ready',{detail:window.APP_DATA}))"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfjs-dist/3.11.174/pdf.min.js" defer></script>
<script src="assets/sync.js?v=2026.11.23-2"></script>
<script src="assets/slips.js?v=2026.11.23-2"></script>
<script src="assets/app.js?v=2026.11.23-2"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.LabApp && window.APP_DATA && Array.isArray(window.APP_DATA.sheets) && typeof window.LabApp.setData === 'function') {
      if (!window.LabApp.DATA || !Array.isArray(window.LabApp.DATA.sheets) || !window.LabApp.DATA.sheets.length) {
        window.LabApp.setData(window.APP_DATA);
      }
    }
    if (window.Sync && window.LabApp && typeof window.Sync.init === 'function') {
      window.Sync.init(window.LabApp);
    }
  });
</script>
</body>
</html>
