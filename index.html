<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tài sản - Vật tư Truyền dẫn LAB</title>
    <link rel="stylesheet" href="assets/style.css">
    <!-- Thư viện hỗ trợ đọc file nguồn trực tiếp trên trình duyệt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfjs-dist/3.11.174/pdf.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button id="btnSidebar" class="btn-icon" title="Mở danh sách sheet">☰</button>
            <h1>Quản lý Tài sản - Vật tư Truyền dẫn LAB</h1>
        </div>
        <div class="header-right">
            <!-- Đặt nút Cập nhật nguồn nằm chung trong nhóm header-right với các nút chức năng -->
            <label for="importFileInput" class="btn-ghost" title="Cập nhật nguồn dữ liệu trực tiếp từ Excel, Word, PDF" style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                📁 Cập nhật nguồn
            </label>
            <input type="file" id="importFileInput" accept=".xlsx, .xls, .docx, .pdf" style="display: none;" />

            <button id="btnSearch" class="btn-ghost" title="Tìm kiếm (Ctrl+F)">🔍 Tìm kiếm</button>
            <button id="btnEdit" class="btn-ghost" title="Chỉnh sửa dữ liệu">✏️ Chỉnh sửa</button>
            
            <details class="menu-dropdown">
                <summary class="btn-ghost">📊 Xuất / Lưu</summary>
                <div class="menu-pop">
                    <button type="button" data-act="xlsx-all">📥 Excel - toàn bộ các sheet</button>
                    <button type="button" data-act="xlsx-cur">📥 Excel - sheet đang xem</button>
                    <button type="button" data-act="csv-cur">📥 CSV - sheet đang xem</button>
                    <hr>
                    <button type="button" data-act="json-out">💾 Sao lưu JSON (kèm chỉnh sửa)</button>
                    <button type="button" data-act="json-in">📂 Nhập sao lưu JSON...</button>
                    <hr>
                    <button type="button" data-act="reset" class="danger">🔄 Khôi phục dữ liệu gốc</button>
                </div>
            </details>
            <button id="btnSlips" class="btn-ghost" title="Quản lý phiếu xuất/nhập">📋 Phiếu</button>
            <button id="btnThemes" class="btn-ghost" title="Đổi giao diện">🌓</button>
        </div>
    </header>

    <div id="editbar" class="editbar" hidden>
        ✏️ <b>Đang ở chế độ chỉnh sửa.</b> Bấm vào ô để sửa, tích ô <b>Đã kiểm</b>, thêm/xóa dòng. Thay đổi <u>chỉ lưu trên trình duyệt này</u> — dùng <b>Xuất / Sao lưu</b> để giữ hoặc chia sẻ.
    </div>

    <div class="layout" id="layout">
        <aside id="sidebar" class="sidebar" aria-label="Danh sách sheet"></aside>
        <div id="overlay" class="overlay"></div>
        <main id="main" class="main"></main>
    </div>

    <input type="file" id="fileIn" accept="application/json,.json" hidden>
    <div id="modalRoot"></div>
    <div id="printRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Các tập lệnh JavaScript điều khiển ứng dụng -->
    <script src="assets/config.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/slips.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
